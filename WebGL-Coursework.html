<!DOCTYPE html>
<html lang="en">

<head>
	<title>CM20220 – S2 – Coursework 2 – Rendering</title>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
	<style>
		body {
			margin: 0;
			overflow: hidden;
		}

		canvas {
			width: 100%;
			height: 100%;
		}
	</style>
</head>

<body>
	<script src="three-r134.js"></script>
	<script src="OBJLoader.js"></script>
	<script>
		"use strict"; // https://stackoverflow.com/q/1335851/72470

		// Global variables that are available in all functions.
		// Note: You can add your own here, e.g. to store the rendering mode.
		var camera, scene, renderer, mesh, cube;
		var loader = new THREE.OBJLoader();
		var bunny = null;
		var rotateX = false;
		var rotateY = false;
		var rotateZ = false;
		var rotateX_bunny = false;
		var rotateY_bunny = false;
		var rotateZ_bunny = false;
		let currentRenderMode = 'faces';

		// Initialise the scene, and draw it for the first time.
		init();
		animate();

		// Listen for keyboard events, to react to them.
		// Note: there are also other event listeners, e.g. for mouse events.
		document.addEventListener('keydown', handleKeyDown);

		// Scene initialisation. This function is only run once, at the very beginning.
		function init() {
			scene = new THREE.Scene();

			// Set up the camera, move it to (3, 4, 5) and look at the origin (0, 0, 0).
			camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
			//camera.position.set(3, 4, 5);
			camera.position.set(3, 4, 5); //look from above
			camera.lookAt(new THREE.Vector3(0, 0, 0));

			// Draw a helper grid in the x-z plane (note: y is up).
			scene.add(new THREE.GridHelper(10, 20, 0xffffff));

			// TASK: Draw a cube (requirement 0).
			const geometry = new THREE.BoxGeometry( 1, 1, 1 );
			const material = new THREE.MeshBasicMaterial( { color: 0x00ff00, side: THREE.BackSide, transparent: true, opacity: 0.3 } );
			cube = new THREE.Mesh( geometry, material );
			scene.add( cube );

			loader.load('bunny-5000.obj', function(object) {
				var box = new THREE.Box3().setFromObject(object);
				var sizevector = new THREE.Vector3();
				var centrevector = new THREE.Vector3();
				var boxsize = box.getSize(sizevector);
				var maxsize = parseFloat(Math.max(boxsize.x, boxsize.y, boxsize.z));
				var centre = box.getCenter(centrevector);
				object.position.x -= centre.x / maxsize;
				object.scale.setScalar(1/maxsize);

				scene.add(object);
				bunny = object;
			});

			// TASK: Visualise the axes of the global coordinate system (requirment 0).
			// Add AxesHelper to visualize the global coordinate system
			const axesHelper = new THREE.AxesHelper(2); // The parameter defines the size of the axes
			scene.add(axesHelper);

			// Basic ambient lighting.
			scene.add(new THREE.AmbientLight(0x000fff));

			// TASK: add more complex lighting for 'face' rendering mode (requirement 2).
			// Added a directional light to simulate sunlight
			var light = new THREE.DirectionalLight(0xffffff, 1);
			light.position.set(5, 10, 7);
			scene.add(light);

			// Added a secondary fill light to soften shadows and add depth
			var fillLight = new THREE.DirectionalLight(0xffffff, 0.4);
			fillLight.position.set(-5, 5, -5);
			scene.add(fillLight);

			// // Added a back light to create a rim light effect
			var backLight = new THREE.DirectionalLight(0xffffff, 0.6);
			backLight.position.set(0, 5, -10);
			scene.add(backLight);

			// Set up the Web GL renderer.
			renderer = new THREE.WebGLRenderer({ antialias: true });
			renderer.setPixelRatio(window.devicePixelRatio); // HiDPI/retina rendering
			renderer.setSize(window.innerWidth, window.innerHeight);

			document.body.appendChild(renderer.domElement);

			// Handle resizing of the browser window.
			window.addEventListener('resize', handleResize, false);
		}

		// Handle resizing of the browser window.
		function handleResize() {
			camera.aspect = window.innerWidth / window.innerHeight;
			camera.updateProjectionMatrix();
			renderer.setSize(window.innerWidth, window.innerHeight);
		}

		// Animation loop function. This function is called whenever an update is required.
		function animate() {
			requestAnimationFrame(animate);
			
			// TASK: This is a good place for code that rotates your cube (requirement 1).
			// Reset rotations between tasks to rotate only around the active axis 
			if (rotateX){
				cube.rotation.x += 0.02; // x-axis
				cube.rotation.y = 0;
				cube.rotation.z = 0;
			}
			if (rotateY){
				cube.rotation.x = 0;
				cube.rotation.y += 0.02; // y-axis
				cube.rotation.z = 0;
			}
			if (rotateZ){
				cube.rotation.x = 0;
				cube.rotation.y = 0;
				cube.rotation.z += 0.02; // z-axis
			}

			// TASK: This is a good place for code that rotates your bunny.
			// Reset rotations between tasks to rotate only around the active axis 
			if (rotateX_bunny){
				bunny.rotation.x += 0.02; // x-axis
				bunny.rotation.y = 0;
				bunny.rotation.z = 0;
			}
			if (rotateY_bunny){
				bunny.rotation.x = 0;
				bunny.rotation.y += 0.02; // y-axis
				bunny.rotation.z = 0;
			}
			if (rotateZ_bunny){
				bunny.rotation.x = 0;
				bunny.rotation.y = 0;
				bunny.rotation.z += 0.02; // z-axis
			}

			// Render the current scene to the screen.
			renderer.render(scene, camera);
		}

		// Handle keyboard presses.
		function handleKeyDown(event) {
			switch (event.key) {
				// Rotation modes. 
				case 'x':
					rotateX = true;
					rotateY = false;
					rotateZ = false;
					break;
				case 'y':
					rotateX = false;
					rotateY = true;
					rotateZ = false;
					break;
				case 'z':
					rotateX = false;
					rotateY = false;
					rotateZ = true;
					break;
				
				case 'X':
				rotateX_bunny = true;
				rotateY_bunny = false;
				rotateZ_bunny = false;
					break;
				case 'Y':
				rotateX_bunny = false;
				rotateY_bunny = true;
				rotateZ_bunny = false;
					break;
				case 'Z':
				rotateX_bunny = false;
				rotateY_bunny = false;
				rotateZ_bunny = true;
					break;

			
				// Render modes.
				case 'f': // f = face
					if (bunny) {
						bunny.traverse(function(child) {
							if (child.isMesh) {
								child.material = new THREE.MeshStandardMaterial({
									color: 0xdddddd,
									metalness: 0.3,
									roughness: 0.6
								});
								child.material.wireframe = false;
							}
						});
					}
					break;

				case 'e': // e = edge
					if (bunny) {
						bunny.traverse(function(child) {
							if (child.isMesh) {
								child.material.wireframe = true;
							}
						})
					}
					break;

				case 'v': // v = vertex
					if (bunny) {
						bunny.traverse(function(child) {
							if (child.isMesh) {
								const pointMaterial = new THREE.PointsMaterial({
									size: 0.02
								});
								const points = new THREE.Points(child.geometry, pointMaterial);
								child.parent.add(points);
								child.visible = false;
							}
						})
					}
					break;
				// TASK: add code for starting/stopping rotations (requirement 1).
			
			}
			switch (event.key.toLowerCase()) {
				case '1':
					currentRenderMode = 'vertices';
					updateCubeRenderMode();
					break;
				case '2':
					currentRenderMode = 'edges';
					updateCubeRenderMode();
					break;
				case '3':
					currentRenderMode = 'faces';
					updateCubeRenderMode();
					break;
			}
		}
		
		function updateCubeRenderMode() {
			scene.remove(cube);
			const geometry = new THREE.BoxGeometry(1, 1, 1);
			let newCube;

			if (currentRenderMode === 'vertices') {
				const material = new THREE.PointsMaterial({ color: 0xff0000, size: 0.05 });
				newCube = new THREE.Points(geometry, material);
			} else if (currentRenderMode === 'edges') {
				const edges = new THREE.EdgesGeometry(geometry);
				const material = new THREE.LineBasicMaterial({ color: 0x00ff00 });
				newCube = new THREE.LineSegments(edges, material);
			} else {
				const material = new THREE.MeshPhongMaterial({ color: 0x0000ff });
				newCube = new THREE.Mesh(geometry, material);
			}

			newCube.rotation.copy(cube.rotation);
			newCube.position.copy(cube.position);
			cube = newCube;
			scene.add(cube);
		}
	</script>
</body>

</html>
